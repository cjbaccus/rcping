[package]
name = "cping-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
authors = ["Carl Baccus"]
description = "Rust port of cping - Concurrent Ping/Traceroute TUI by Willem A. Schreuder (AC0KQ)"
repository = "https://github.com/cjbaccus/rc-ping"
readme = "README.md"
keywords = ["ping", "icmp", "network", "monitoring", "tui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dns-lookup = "2"
libc = "0.2"
ratatui = "0.29"
socket2 = { version = "0.5", features = ["all"] }

[features]
gpio = ["dep:rppal"]

[dependencies.rppal]
version = "0.19"
optional = true
